name: Auto Commit

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "pronitdxd"
          git config user.email "pronitd07@gmail.com"

      - name: Make random commits (1 to 4)
        run: |
          COUNT=$(( RANDOM % 4 + 1 ))
          echo "Making $COUNT commits today"
          for i in $(seq 1 $COUNT); do
            sleep $(( RANDOM % 10 + 1 ))
            echo "$(date '+%Y-%m-%d %H:%M:%S') - commit $i of $COUNT" >> activity.log
            git add activity.log
            git commit -m "chore: daily activity update ($i/$COUNT)"
          done

      - name: Push commits
        run: git push
